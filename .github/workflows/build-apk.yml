name: Build APK and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK (release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Sign APK (debug sign)
        run: |
          # Use debug keystore for development build
          ANDROID_SDK_ROOT=${{ env.ANDROID_HOME }}
          KEYSTORE="$ANDROID_SDK_ROOT/debug.keystore"
          if [ -f "$KEYSTORE" ]; then
            cd android
            for apk in app/build/outputs/apk/release/*.apk; do
              [ -f "$apk" ] || continue
              base=$(basename "$apk" .apk)
              apksigner sign --ks "$KEYSTORE" \
                --ks-pass pass:android \
                --ks-key-alias androiddebugkey \
                --out "app/build/outputs/apk/release/${base}-signed.apk" \
                "$apk" 2>/dev/null || true
            done
          fi

      - name: Get version name
        id: version
        run: |
          echo "version=v1.0.0-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "tag=v1.0.0-$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: appfilter-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AppFilter ${{ steps.version.outputs.version }}
          body: |
            ## AppFilter - Build ${{ steps.version.outputs.version }}
            
            Aplikasi filter konten media sosial untuk Android.
            
            ### Cara Install
            1. Download APK dari attachment di bawah
            2. Buka di perangkat Android Anda
            3. Izinkan instalasi dari sumber tidak dikenal
            4. Buka aplikasi dan ikuti panduan aktivasi AccessibilityService
            
            ### Fitur
            - Filter kata kunci pada konten media sosial
            - Deteksi konten sensitif via AccessibilityService
            - Dukungan YouTube, Instagram, TikTok, X
            - Foreground Service untuk pemfilteran latar belakang
            - Privasi: semua diproses di perangkat
            
            ### Catatan
            - Aplikasi untuk sideload pribadi
            - Android 8.0+ required
            - Memerlukan izin AccessibilityService
          files: android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false